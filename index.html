<script>
const cfgKey='rpland_supabase_cfg_v2',tokenKey='rpland_token_v2';let sb=true,mode='login',me=null;
const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function cfg(){try{const x=JSON.parse(localStorage.getItem(cfgKey)||'{}');if(x.url&&x.key)return x}catch{}return {url:'https://ewznzmyujrnydjavwocj.supabase.co',key:'sb_publishable_WSbUEaV-xz6jTplxpIFFAg_ooBmTNyT'}}function token(){return localStorage.getItem(tokenKey)||''}function setToken(t){t?localStorage.setItem(tokenKey,t):localStorage.removeItem(tokenKey)}
function msg(id,t,ok=false){$(id).textContent=t;$(id).className='msg '+(ok?'ok':'')}

function openSupportRubika(){window.open('https://rubika.ir/Mohammadreza20045','_blank')}function show(page){['home','account','orders','chat','support','setup'].forEach(x=>$(x)?.classList.toggle('hide',x!==page));['home','orders','chat','support','account','setup'].forEach(x=>$("n-"+x)?.classList.toggle('active',x===page));if(page==='account')renderAccount();if(page==='orders')renderOrders();if(page==='chat')renderChat();if(page==='home')loadProducts();scrollTo(0,0)}

function setMode(m){mode=m;$('loginTab').classList.toggle('active',m==='login');$('regTab').classList.toggle('active',m==='register');$('pw2box').classList.toggle('hide',m!=='register');$('authBtn').textContent=m==='register'?'ساخت حساب':'ورود';$('authMsg').textContent=''}
async function connect(){const c=cfg();return !!(c.url&&c.key&&/^https:\/\//i.test(c.url))}
async function saveConfig(){const url=$('surl').value.trim().replace(/\/$/,''),key=$('skey').value.trim();if(!url||!key)return msg('setupMsg','هر دو مقدار را وارد کن.');localStorage.setItem(cfgKey,JSON.stringify({url,key}));if(await connect()){msg('setupMsg','اتصال به Supabase موفق شد ✅',true);await loadProducts()}}
async function call(fn,args){const c=cfg();if(!c.url||!c.key)throw new Error('اتصال Supabase تنظیم نشده است');const r=await fetch(c.url.replace(/\/$/,'')+'/rest/v1/rpc/'+encodeURIComponent(fn),{method:'POST',headers:{'apikey':c.key,'Authorization':'Bearer '+c.key,'Content-Type':'application/json','Accept':'application/json','Cache-Control':'no-cache','Pragma':'no-cache'},cache:'no-store',body:JSON.stringify(args||{})});let d=null;try{d=await r.json()}catch{}if(!r.ok){throw new Error(d?.message||d?.hint||d?.details||('HTTP '+r.status))}return d}
async function loadProducts(){if(!await connect())return;try{const c=cfg();const r=await fetch(c.url.replace(/\/$/,'')+'/rest/v1/rp_products?select=*&active=eq.true&order=id.asc',{headers:{'apikey':c.key,'Authorization':'Bearer '+c.key,'Accept':'application/json'}});const data=await r.json();if(!r.ok)throw new Error(data?.message||'خطای دریافت محصولات');const foods=[],coins=[],fuel=[],rare=[];(data||[]).forEach(p=>{const n=String(p.name||'').toLowerCase();if(String(p.category||'').toLowerCase()==='rare'){rare.push(p);return}if(n.includes('سکه')||/\b(?:5k|10k|50k|100k)\b/i.test(n))coins.push(p);else if(n.includes('بنزین')||n.includes('سوخت')||n.includes('fuel'))fuel.push(p);else foods.push(p)});const card=p=>{const n=String(p.name||'').toLowerCase();const norm=n.replace(/[۰-۹]/g,d=>'0123456789'['۰۱۲۳۴۵۶۷۸۹'.indexOf(d)]).replace(/[٠-٩]/g,d=>'0123456789'['٠١٢٣٤٥٦٧٨٩'.indexOf(d)]).replace(/\s+/g,'');const is5=norm.includes('5k')||norm.includes('5کی')||norm.includes('۵k');const is10=norm.includes('10k')||norm.includes('10کی');const is50=norm.includes('50k')||norm.includes('50کی');const is100=norm.includes('100k')||norm.includes('100کی');const coin=n.includes('سکه')||is5||is10||is50||is100;const oldMap=p.old_price_toman?Number(p.old_price_toman).toLocaleString('fa-IR'):(is10?'۷٬۵۰۰':is50?'۳۵٬۰۰۰':is100?'۷۰٬۰۰۰':null);const discount=p.discount_percent!=null?(Number(p.discount_percent).toLocaleString('fa-IR')+'٪'):(is10?'۳۳٪':is50?'۱۷٪':is100?'۳۰٪':null);let displayPrice=Number(p.price_toman);let displayQty=Number(p.quantity)||1;if(n.includes('پیتزا')){displayPrice=15000;displayQty=40}else if(n.includes('سوپ')){displayPrice=15000;displayQty=40}else if(n.includes('دمنوش')){displayPrice=13000;displayQty=40}else if(n.includes('املت')){displayPrice=5000;displayQty=40}else if(n.includes('نیمرو')){displayPrice=5000;displayQty=40}else if(n.includes('هات')&&n.includes('داگ')){displayPrice=2000;displayQty=40}else if(n.includes('بنزین')||n.includes('سوخت')||n.includes('fuel')){displayPrice=5000;displayQty=40}const price=displayPrice.toLocaleString('fa-IR');const priceHtml=coin&&oldMap?`<div class="coinPrice"><span class="oldPrice">${oldMap} تومان</span>${discount?`<span class="discount">تخفیف ${discount}</span>`:''}<span class="newPrice">${price} تومان</span></div>`:`<div class="productPrice">${price} تومان</div>`;return `<div class="product"><div class="buyWrap"><div class="productInfo"><div class="productName">${esc(p.emoji||'')} ${esc(p.name)}</div>${priceHtml}<div class="productQty">مقدار: ${displayQty.toLocaleString('fa-IR')}</div></div><button class="btn" onclick="buy(${p.id})">خرید</button></div></div>`};const section=(title,arr)=>arr.length?`<section class="category"><h2 class="categoryTitle">${title}</h2>${arr.map(card).join('')}</section>`:'';$('products').innerHTML=section('🍔 غذاها',foods)+section('🪙 سکه',coins)+section('⛽ بنزین',fuel)+section('💎 آیتم‌های کمیاب',rare)||'<div class="card">محصولی وجود ندارد.</div>'}catch(e){$('products').innerHTML='<div class="card"><b>خطای اتصال به دیتابیس</b><div class="small">'+esc(friendly(e))+'</div><button class="btn" style="margin-top:10px" onclick="loadProducts()">🔄 تلاش دوباره</button></div>'}}
async function submitAuth(){const id=$('uid').value.trim(),pw=$('pw').value;if(id.length<3||pw.length<5)return msg('authMsg','ID حداقل ۳ و رمز حداقل ۵ کاراکتر باشد.');try{if(mode==='register'){if(pw!==$('pw2').value)return msg('authMsg','تکرار رمز درست نیست.');const d=await call('rp_register',{p_username:id,p_password:pw});setToken(d.token);me=await call('rp_buyer_me',{p_token:token()})||d.user;closeLogin();await renderAccount();return}const d=await call('rp_login',{p_username:id,p_password:pw});setToken(d.token);me=await call('rp_buyer_me',{p_token:token()})||d.user;closeLogin();await renderAccount()}catch(e){msg('authMsg',friendly(e))}}
async function restore(){if(!token()||!sb)return;try{me=await call('rp_buyer_me',{p_token:token()});if(!me)setToken('')}catch{setToken('');me=null}}
async function logout(){try{if(sb&&token())await call('rp_logout',{p_token:token()})}catch{}setToken('');me=null;document.body.classList.add('locked');document.querySelector('.top')?.classList.add('siteHidden');document.querySelector('main')?.classList.add('siteHidden');document.querySelector('.nav')?.classList.add('siteHidden');$('firstAuth').style.display='flex';gateMode('login')}
async function buy(pid){if(!me){openLogin();return}try{await call('rp_create_order',{p_token:token(),p_product_id:pid,p_quantity:1});alert('سفارش ثبت شد ✅');await renderOrders();show('orders')}catch(e){alert(friendly(e))}}
async function renderOrders(){const box=$('orders');if(!me){box.innerHTML='<div class="card"><h2>📦 سفارش‌ها</h2><p class="muted">برای دیدن سفارش‌ها وارد حساب شو.</p><button class="btn" onclick="openLogin()">ورود</button></div>';return}try{const data=await call('rp_my_orders',{p_token:token()});const pending=(data||[]).filter(o=>o.status==='pending'),done=(data||[]).filter(o=>o.status==='paid'),failed=(data||[]).filter(o=>o.status==='cancelled');const card=o=>`<div class="user"><b>${esc(o.product_name)}</b><div class="small">${Number(o.total_price_toman).toLocaleString('fa-IR')} تومان<br>${new Date(o.created_at).toLocaleString('fa-IR')}<br>شماره سفارش: ${o.id}</div>${o.status==='paid'?`<div style="margin-top:10px;padding:12px;border-radius:10px;background:#123b2a;color:#7ff0b0;text-align:center;font-weight:800">✅ تمام — پرداخت شما تأیید شد.</div>`:''}${o.status==='cancelled'?`<div style="margin-top:10px;padding:12px;border-radius:10px;background:#4a1f2b;color:#ff9eac;text-align:center;font-weight:800">❌ درخواست شما انجام نشد.</div>`:''}${o.status==='pending'?`<div class="actions" style="margin-top:8px"><button class="btn" onclick="payOrder(${o.id})">💳 پرداخت</button><button class="btn bad" onclick="cancelOrder(${o.id})">لغو سفارش</button></div>`:`<div class="actions" style="margin-top:8px"><button class="btn bad" onclick="deleteMyOrder(${o.id})">🗑️ حذف کامل</button></div>`}</div>`;box.innerHTML=`<div class="card"><h2>📦 سفارش‌های من</h2><h3>🟡 سفارشات</h3>${pending.length?pending.map(card).join(''):'<p class="muted">سفارش جدیدی نیست.</p>'}<h3>🟢 سفارشات انجام شده</h3>${done.length?done.map(card).join(''):'<p class="muted">موردی نیست.</p>'}<h3>🔴 سفارشات انجام نشده</h3>${failed.length?failed.map(card).join(''):'<p class="muted">موردی نیست.</p>'}</div>`}catch(e){box.innerHTML='<div class="card">'+esc(friendly(e))+'</div>'}}
async function payOrder(id){window.open('https://rubika.ir/Mohammadreza20045?order='+encodeURIComponent(id),'_blank');} 
async function cancelOrder(id){
  if(!confirm('این سفارش لغو شود؟'))return;
  const orderId=Number(id);
  try{
    const r=await call('rp_cancel_order',{p_token:token(),p_order_id:orderId});
    if(!r || r.success!==true)throw new Error('لغو سفارش انجام نشد');
    alert('❌ سفارش لغو شد.');
    // از دیتابیس دوباره بخوان؛ اگر لحظه‌ای تأخیر بود، چند بار تلاش کن.
    for(let i=0;i<3;i++){
      await new Promise(resolve=>setTimeout(resolve,250));
      try{
        const fresh=await call('rp_my_orders',{p_token:token()});
        const found=(fresh||[]).find(o=>Number(o.id)===orderId);
        if(found && found.status==='cancelled'){
          await renderOrders();
          return;
        }
      }catch{}
    }
    // نمایش فوری در بخش لغوشده‌ها؛ وضعیت در دیتابیس قبلاً ثبت شده است.
    await renderOrders();
  }catch(e){alert(friendly(e))}
}
async function deleteMyOrder(id){if(!confirm('این سفارش برای همیشه حذف شود؟'))return;try{await call('rp_delete_order',{p_token:token(),p_order_id:id});await renderOrders()}catch(e){alert(friendly(e))}}
async function changeUsername(){
  const newName=prompt('نام کاربری جدید را وارد کن:',me?.username||'');
  if(newName===null)return;
  if(newName.trim().length<3)return alert('نام کاربری حداقل ۳ کاراکتر باشد.');
  try{
    const d=await call('rp_update_username',{p_token:token(),p_username:newName.trim()});
    me.username=d.username;
    alert('نام کاربری با موفقیت تغییر کرد ✅');
    await renderAccount();
  }catch(e){alert(friendly(e))}
}
async function changePassword(){
  const pw=prompt('رمز عبور جدید را وارد کن:','');
  if(pw===null)return;
  if(pw.length<5)return alert('رمز عبور حداقل ۵ کاراکتر باشد.');
  try{
    await call('rp_update_password',{p_token:token(),p_password:pw});
    const fresh=await call('rp_buyer_me',{p_token:token()});
    if(fresh) me=fresh;
    alert('رمز عبور با موفقیت تغییر کرد ✅\nمالک بعد از تازه‌سازی پنل، رمز جدید را می‌بیند.');
    await renderAccount();
  }catch(e){alert(friendly(e))}
}
function profileCard(){return `<div class="card"><h3>⚙️ اطلاعات حساب</h3><div class="small">نام کاربری: <b>${esc(me.username)}</b><br>رمز عبور: <b>${esc(me.password_plain||'نمایش داده نمی‌شود')}</b>${me.role==='admin'?`<br>نام نمایشی چت: <b id="myChatDisplayName">در حال دریافت...</b>`:''}</div><div class="actions" style="margin-top:10px"><button class="btn" onclick="changeUsername()">✏️ تغییر نام کاربری</button><button class="btn alt" onclick="changePassword()">🔐 تغییر رمز عبور</button>${me.role==='admin'?`<button class="btn alt" onclick="changeChatDisplayName()">💬 تغییر نام نمایشی چت</button>`:''}<button class="btn" onclick="show('chat')">💬 ${me.role==='admin'?'چت کاربران':'چت با ادمین‌ها'}</button></div></div>`}
async function loadOwnerDashboard(){if(me?.role!=='admin')return;try{const users=await call('rp_owner_users',{p_token:token()});const orders=await call('rp_my_orders',{p_token:token()});const us=Array.isArray(users)?users:[];const os=Array.isArray(orders)?orders:[];const sales=os.filter(o=>o.status!=='cancelled').reduce((a,o)=>a+Number(o.total_price_toman||0),0);me.dashboard={stats:{users:us.length,orders:os.length,sales:sales},users:us,orders:os}}catch(e){if(!me.dashboard)me.dashboard={stats:{users:0,orders:0,sales:0},users:[],orders:[]};console.warn(e)}}
async function renderAccount(){const box=$('account');if(!me){box.innerHTML='<div class="card"><h2>👤 حساب</h2><p class="muted">وارد حساب نشده‌ای.</p><button class="btn" onclick="openLogin()">ورود / ثبت‌نام</button></div>';return}try{const fresh=await call('rp_buyer_me',{p_token:token()});if(fresh)me=fresh}catch(e){}if(me.role==='admin')await loadOwnerDashboard();let html=`<div class="card"><h2>${esc(me.username)}</h2><div class="small">${me.role==='admin'?'👑 مالک RP LAND':'کاربر'}<br>عضویت: ${new Date(me.joined_at).toLocaleString('fa-IR')}</div><button class="btn" style="margin-top:10px" onclick="logout()">خروج</button></div>`+profileCard();box.innerHTML=html+(me.role==='admin'?ownerPanelFromMe():'');if(me.role==='admin'){renderOwnerUsers();renderOwnerOrders();loadMyChatDisplayName()}}
function ownerPanelFromMe(){try{const d=me.dashboard||{};const st=d.stats||{};const users=d.users||[];const orders=d.orders||[];const um={};users.forEach(u=>um[u.id]=u.username);window.ownerUsers=users;window.ownerOrders=orders;return `<div class="card"><h2>🛡️ پنل مالک</h2><button class="btn" onclick="refreshOwnerPanel()" style="margin-top:8px">🔄 تازه‌سازی پنل و رمزها</button><div class="grid"><div class="product"><b>${Number(st.users||users.length).toLocaleString('fa-IR')}</b><div class="small">کاربر</div></div><div class="product"><b>${Number(st.orders||orders.length).toLocaleString('fa-IR')}</b><div class="small">سفارش</div></div><div class="product"><b>${Number(st.sales||0).toLocaleString('fa-IR')}</b><div class="small">فروش (تومان)</div></div></div><h3>🔎 جستجوی کاربر</h3><div class="field"><input id="userSearch" placeholder="نام کاربری را جستجو کن..." oninput="renderOwnerUsers()"></div><div id="ownerUsersList"></div><h3>🔎 جستجوی سفارش</h3><div class="field"><input id="orderSearch" placeholder="شماره سفارش، نام کاربر یا محصول..." oninput="renderOwnerOrders()"></div><div id="ownerOrdersList"></div></div>`}catch(e){return '<div class="card"><b>خطای پنل مالک</b><div class="small">'+esc(friendly(e))+'</div></div>'}}
function renderOwnerUsers(){const box=$('ownerUsersList');if(!box)return;const q=($('userSearch')?.value||'').trim().toLowerCase();const users=(window.ownerUsers||[]).filter(u=>!q||String(u.username||'').toLowerCase().includes(q));box.innerHTML=users.length?users.map(u=>{const isPrimary=String(u.username||'').trim().toLowerCase()==='mohammad reza fc';const viewer=String(me?.username||'').trim().toLowerCase();const isYasin=viewer==='yasinf112'||viewer==='jr yasin';const canEdit=!isYasin||!isPrimary;const canSeePassword=(viewer==='mohammad reza fc')||(u.role!=='admin')||(viewer===String(u.username||'').trim().toLowerCase());const shownPassword=canSeePassword?(u.password_plain||'نامشخص'):'نمایش داده نمی‌شود';return `<div class="user"><b>${esc(u.username)}</b> ${u.role==='admin'?'🛡️':''}<div class="small">رمز عبور: <b>${esc(shownPassword)}</b><br>${u.role==='admin'?`نام نمایشی چت: <b>${esc(u.chat_display_name||'ادمین')}</b><br>`:''}عضویت: ${new Date(u.joined_at).toLocaleString('fa-IR')}<br>تعداد سفارش: ${Number(u.order_count||0).toLocaleString('fa-IR')}</div>${`<div class="actions" style="margin-top:8px">${canEdit?`<button class="btn" onclick="ownerEditUser(${u.id})">✏️ تغییر نام / رمز</button>`:'<span></span>'}${(String(me?.username||'').trim().toLowerCase()==='mohammad reza fc'&&u.role==='admin')?`<button class="btn alt" onclick="ownerEditChatDisplayName(${u.id})">🏷️ تغییر نام چت</button>`:'<span></span>'}<button class="btn alt" onclick="openUserChat(${u.id})">💬 چت با کاربر</button></div>`}</div>`}).join(''):'<p class="muted">کاربری پیدا نشد.</p>'}
function renderOwnerOrders(){const box=$('ownerOrdersList');if(!box)return;const q=($('orderSearch')?.value||'').trim().toLowerCase();const users=window.ownerUsers||[];const um={};users.forEach(u=>um[u.id]=u.username);const all=(window.ownerOrders||[]);const groups=[['🟡 سفارشات',all.filter(o=>o.status==='pending')],['🟢 سفارشات انجام شده',all.filter(o=>o.status==='paid')],['🔴 سفارشات انجام نشده',all.filter(o=>o.status==='cancelled')]];const card=o=>{const uname=o.customer_username||o.username||um[o.user_id]||('کاربر #'+o.user_id);const hay=[o.id,uname,o.product_name,o.status,o.total_price_toman].join(' ').toLowerCase();if(q&&!hay.includes(q))return '';return `<div class="user"><b>👤 سفارش‌دهنده: ${esc(uname)}</b><div class="small">محصول: ${esc(o.product_name)}<br>مبلغ: ${Number(o.total_price_toman).toLocaleString('fa-IR')} تومان<br>تاریخ: ${new Date(o.created_at).toLocaleString('fa-IR')}<br>شماره سفارش: ${o.id}</div>${o.status==='pending'?`<div class="actions"><button class="btn" onclick="setOrderStatus(${o.id},'paid')">تأیید انجام ✅</button><button class="btn bad" onclick="setOrderStatus(${o.id},'cancelled')">لغو سفارش ❌</button></div>`:`<div class="actions"><button class="btn bad" onclick="deleteOwnerOrder(${o.id})">🗑️ حذف کامل</button></div>`}</div>`};box.innerHTML=groups.map(g=>`<h3>${g[0]}</h3>${g[1].length?g[1].map(card).join(''):'<p class="muted">موردی نیست.</p>'}`).join('')}
async function ownerEditUser(id){
  const u=(window.ownerUsers||[]).find(x=>Number(x.id)===Number(id));
  if(!u)return;
  const newName=prompt('نام کاربری جدید (خالی = بدون تغییر):',u.username||'');
  if(newName===null)return;
  const newPw=prompt('رمز جدید (خالی = بدون تغییر):','');
  if(newPw===null)return;
  const cleanName=newName.trim();
  if(cleanName && cleanName.length<3)return alert('نام کاربری حداقل ۳ کاراکتر باشد.');
  if(newPw && newPw.length<5)return alert('رمز عبور حداقل ۵ کاراکتر باشد.');
  if(!cleanName && !newPw)return alert('حداقل یکی از نام کاربری یا رمز را تغییر بده.');
  try{
    const d=await call('rp_owner_update_user',{
      p_token:token(),
      p_user_id:id,
      p_username:cleanName||null,
      p_password:newPw||null
    });
    const fresh=await call('rp_buyer_me',{p_token:token()});
    if(fresh)me=fresh;
    alert('اطلاعات کاربر با موفقیت تغییر کرد ✅\nرمز فعلی: '+(d.password_plain||'نامشخص'));
    await renderAccount();
  }catch(e){alert(friendly(e))}
}
async function refreshOwnerPanel(){try{const fresh=await call('rp_buyer_me',{p_token:token()});if(fresh)me=fresh;await loadOwnerDashboard();await renderAccount();await renderOrders();alert('پنل مالک تازه شد ✅')}catch(e){alert(friendly(e))}}
async function deleteOwnerOrder(id){if(!confirm('این سفارش برای همیشه از دیتابیس حذف شود؟'))return;try{await call('rp_delete_order',{p_token:token(),p_order_id:id});const fresh=await call('rp_buyer_me',{p_token:token()});if(fresh)me=fresh;await renderAccount();await renderOrders();alert('سفارش کامل از دیتابیس حذف شد ✅')}catch(e){alert(friendly(e))}}
async function setOrderStatus(id,status){try{const ok=await call('rp_owner_set_order_status',{p_token:token(),p_order_id:id,p_status:status});if(!ok && ok!==true)throw new Error('تغییر وضعیت سفارش انجام نشد');const fresh=await call('rp_buyer_me',{p_token:token()});if(fresh)me=fresh;alert(status==='paid'?'✅ تمام — سفارش به انجام شده منتقل شد.':'❌ سفارش به انجام نشده منتقل شد.');await renderAccount();await renderOrders()}catch(e){alert(friendly(e))}}
let chatSelectedUser=null;
async function renderChat(){
  const box=$('chat');
  if(!box)return;
  if(!me){box.innerHTML='<div class="card"><h2>💬 چت با ادمین‌ها</h2><p class="muted">برای استفاده از چت وارد حساب شو.</p><button class="btn" onclick="openLogin()">ورود</button></div>';return}
  if(me.role==='admin') return renderAdminChat(box);
  chatSelectedUser=Number(me.id);
  await renderUserChat(box);
}
async function renderUserChat(box){
  try{
    const data=await call('rp_chat_messages',{p_token:token(),p_user_id:Number(me.id)});
    box.innerHTML='<div class="card"><h2>💬 چت با ادمین‌ها</h2><p class="muted">این گفت‌وگو خصوصی است و تمام ادمین‌ها می‌توانند پیام‌های این گفتگو را ببینند و پاسخ دهند.</p><div id="chatMessages" class="chatMessages">'+chatMessagesHtml(data||[])+'</div><div class="chatComposer"><textarea id="chatInput" maxlength="2000" placeholder="پیامت را برای ادمین‌ها بنویس..."></textarea><button class="btn" onclick="sendChatMessage()">ارسال 💬</button></div></div>';
    const el=$('chatMessages');if(el)el.scrollTop=el.scrollHeight;
  }catch(e){box.innerHTML='<div class="card"><h2>💬 چت با ادمین‌ها</h2><div class="small">'+esc(friendly(e))+'</div><button class="btn" style="margin-top:10px" onclick="renderChat()">🔄 تلاش دوباره</button></div>'}
}
function chatMessagesHtml(data){return (data||[]).map(m=>`<div class="chatBubble ${m.sender_role==='admin'?'admin':'user'}"><div>${esc(m.message)}</div><div class="chatMeta">${m.sender_role==='admin'?'🛡️ '+esc(m.sender_display_name||'ادمین'):'👤 شما'} • ${new Date(m.created_at).toLocaleString('fa-IR')}</div></div>`).join('')||'<div class="muted" style="text-align:center;padding:25px">هنوز پیامی ارسال نشده است.</div>'}
async function sendChatMessage(userId=null){
  const input=$('chatInput');const text=String(input?.value||'').trim();
  if(!text)return;
  try{await call('rp_chat_send',{p_token:token(),p_user_id:userId==null?Number(me.id):Number(userId),p_message:text});input.value='';await renderChat();}catch(e){alert(friendly(e))}
}
async function renderAdminChat(box){
  try{
    const users=await call('rp_chat_users',{p_token:token()});
    const list=Array.isArray(users)?users:[];
    if(chatSelectedUser==null && list.length)chatSelectedUser=Number(list[0].id);
    const selected=list.find(u=>Number(u.id)===Number(chatSelectedUser));
    let messages=[];
    if(selected)messages=await call('rp_chat_messages',{p_token:token(),p_user_id:Number(selected.id)})||[];
    box.innerHTML=`<div class="card"><h2>💬 چت کاربران</h2><p class="muted">همه ادمین‌ها به تمام گفتگوهای کاربران دسترسی دارند.</p><div class="chatList">${list.map(u=>`<div class="chatItem ${Number(u.id)===Number(chatSelectedUser)?'active':''}" onclick="selectChatUser(${u.id})"><b>👤 ${esc(u.username)}</b>${u.role==='admin'?`<div class="chatName">نام چت: ${esc(u.chat_display_name||'ادمین')}</div>`:''}<div class="small">${u.last_message?esc(String(u.last_message).slice(0,90)):'هنوز پیامی ندارد'}${u.last_at?' • '+new Date(u.last_at).toLocaleString('fa-IR'):''}</div></div>`).join('')||'<div class="muted">کاربری وجود ندارد.</div>'}</div></div>`+
      (selected?`<div class="card"><h3>گفتگو با ${esc(selected.username)}</h3><div class="chatName">نام نمایشی شما در این چت: ${esc(me.chat_display_name||'ادمین')}</div><div id="chatMessages" class="chatMessages">${chatMessagesHtml(messages)}</div><div class="chatComposer"><textarea id="chatInput" maxlength="2000" placeholder="پاسخ به ${esc(selected.username)}..."></textarea><button class="btn" onclick="sendChatMessage(${selected.id})">ارسال 💬</button></div></div>`:'<div class="card"><p class="muted">یک کاربر را انتخاب کن.</p></div>');
    const el=$('chatMessages');if(el)el.scrollTop=el.scrollHeight;
  }catch(e){box.innerHTML='<div class="card"><h2>💬 چت کاربران</h2><div class="small">'+esc(friendly(e))+'</div><button class="btn" style="margin-top:10px" onclick="renderChat()">🔄 تلاش دوباره</button></div>'}
}
function openUserChat(id){chatSelectedUser=Number(id);show('chat')}
function selectChatUser(id){chatSelectedUser=Number(id);renderChat()}
async function loadMyChatDisplayName(){if(me?.role!=='admin')return;try{const d=await call('rp_admin_display_name_get',{p_token:token(),p_user_id:Number(me.id)});me.chat_display_name=d?.chat_display_name||'ادمین';const el=$('myChatDisplayName');if(el)el.textContent=me.chat_display_name}catch(e){const el=$('myChatDisplayName');if(el)el.textContent='ادمین'}}
async function changeChatDisplayName(){if(me?.role!=='admin')return;await loadMyChatDisplayName();const v=prompt('نامی که کاربران در چت می‌بینند:',me.chat_display_name||'ادمین');if(v===null)return;const name=v.trim();if(name.length<2||name.length>40)return alert('نام نمایشی باید بین ۲ تا ۴۰ کاراکتر باشد.');try{const d=await call('rp_admin_display_name_set',{p_token:token(),p_user_id:Number(me.id),p_display_name:name});me.chat_display_name=d?.chat_display_name||name;await renderAccount();alert('نام نمایشی چت ذخیره شد ✅')}catch(e){alert(friendly(e))}}
async function ownerEditChatDisplayName(id){const u=(window.ownerUsers||[]).find(x=>Number(x.id)===Number(id));if(!u||u.role!=='admin')return;const v=prompt('نام نمایشی چت برای این ادمین:',u.chat_display_name||'ادمین');if(v===null)return;const name=v.trim();if(name.length<2||name.length>40)return alert('نام نمایشی باید بین ۲ تا ۴۰ کاراکتر باشد.');try{await call('rp_admin_display_name_set',{p_token:token(),p_user_id:Number(id),p_display_name:name});await refreshOwnerPanel()}catch(e){alert(friendly(e))}}
let gateAuthMode='login';function gateMode(m){gateAuthMode=m;$('gateLoginTab').classList.toggle('active',m==='login');$('gateRegTab').classList.toggle('active',m==='register');$('gatePw2').classList.toggle('siteHidden',m!=='register');$('gateAuthBtn').textContent=m==='register'?'ساخت حساب':'ورود';$('gateMsg').textContent='';$('gateUid').focus()}async function gateSubmit(){const id=$('gateUid').value.trim(),pw=$('gatePw').value;if(id.length<3||pw.length<5)return $('gateMsg').textContent='آیدی حداقل ۳ و رمز حداقل ۵ کاراکتر باشد.';try{if(gateAuthMode==='register'){if(pw!==$('gatePw2').value)return $('gateMsg').textContent='تکرار رمز درست نیست.';const d=await call('rp_register',{p_username:id,p_password:pw});setToken(d.token);me=await call('rp_buyer_me',{p_token:token()})||d.user}else{const d=await call('rp_login',{p_username:id,p_password:pw});setToken(d.token);me=await call('rp_buyer_me',{p_token:token()})||d.user}$('firstAuth').style.display='none';document.body.classList.remove('locked');document.querySelector('.top')?.classList.remove('siteHidden');document.querySelector('main')?.classList.remove('siteHidden');document.querySelector('.nav')?.classList.remove('siteHidden');show('home');await renderAccount()}catch(e){$('gateMsg').textContent=friendly(e)}}function finishSplash(){const sp=$('splashScreen');sp.classList.add('hideSplash');setTimeout(()=>{sp.remove();$('firstAuth').style.display='flex'},450)}
async function init(){document.querySelector('.top')?.classList.add('siteHidden');document.querySelector('main')?.classList.add('siteHidden');document.querySelector('.nav')?.classList.add('siteHidden');if(await connect()){await loadProducts()}else{$('products').innerHTML='<div class="card"><h3>⚠️ اتصال برقرار نشد</h3><p class="muted">اتصال دیتابیس را بررسی کن.</p></div>'}setTimeout(finishSplash,1300)}init();
</script></body></html>
