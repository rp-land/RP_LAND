async function loadProducts(){if(!await connect())return;try{const c=cfg();const r=await fetch(c.url.replace(/\/$/,'')+'/rest/v1/rp_products?select=*&active=eq.true&order=id.asc',{headers:{'apikey':c.key,'Authorization':'Bearer '+c.key,'Accept':'application/json'}});const data=await r.json();if(!r.ok)throw new Error(data?.message||'خطای دریافت محصولات');const foods=[],coins=[],fuel=[],rare=[];(data||[]).forEach(p=>{const n=String(p.name||'').toLowerCase();if(String(p.category||'').toLowerCase()==='rare')rare.push(p);else if(n.includes('سکه')||/\b(?:5k|10k|50k|100k)\b/i.test(n))coins.push(p);else if(n.includes('بنزین')||n.includes('سوخت')||n.includes('fuel'))fuel.push(p);else foods.push(p)});const card=p=>{const n=String(p.name||'').toLowerCase();const norm=n.replace(/[۰-۹]/g,d=>'0123456789'['۰۱۲۳۴۵۶۷۸۹'.indexOf(d)]).replace(/[٠-٩]/g,d=>'0123456789'['٠١٢٣٤٥٦٧٨٩'.indexOf(d)]).replace(/\s+/g,'');const is5=norm.includes('5k')||norm.includes('5کی')||norm.includes('۵k');const is10=norm.includes('10k')||norm.includes('10کی');const is50=norm.includes('50k')||norm.includes('50کی');const is100=norm.includes('100k')||norm.includes('100کی');const coin=n.includes('سکه')||is5||is10||is50||is100;const oldMap=p.old_price_toman?Number(p.old_price_toman).toLocaleString('fa-IR'):(is10?'۷٬۵۰۰':is50?'۳۵٬۰۰۰':is100?'۷۰٬۰۰۰':null);const discount=p.discount_percent!=null?(Number(p.discount_percent).toLocaleString('fa-IR')+'٪'):(is10?'۳۳٪':is50?'۱۷٪':is100?'۳۰٪':null);let displayPrice=Number(p.price_toman);let displayQty=Number(p.quantity)||1;if(n.includes('پیتزا')){displayPrice=15000;displayQty=40}else if(n.includes('سوپ')){displayPrice=15000;displayQty=40}else if(n.includes('دمنوش')){displayPrice=13000;displayQty=40}else if(n.includes('املت')){displayPrice=5000;displayQty=40}else if(n.includes('نیمرو')){displayPrice=5000;displayQty=40}else if(n.includes('هات')&&n.includes('داگ')){displayPrice=2000;displayQty=40}else if(n.includes('بنزین')||n.includes('سوخت')||n.includes('fuel')){displayPrice=5000;displayQty=40}const price=displayPrice.toLocaleString('fa-IR');const priceHtml=coin&&oldMap?`<div class="coinPrice"><span class="oldPrice">${oldMap} تومان</span>${discount?`<span class="discount">تخفیف ${discount}</span>`:''}<span class="newPrice">${price} تومان</span></div>`:`<div class="productPrice">${price} تومان</div>`;return `<div class="product"><div class="buyWrap"><div class="productInfo"><div class="productName">${esc(p.emoji||'')} ${esc(p.name)}</div>${priceHtml}<div class="productQty">مقدار: ${displayQty.toLocaleString('fa-IR')}</div></div><button class="btn" onclick="buy(${p.id})">خرید</button></div></div>`};const section=(title,arr)=>arr.length?`<section class="category"><h2 class="categoryTitle">${title}</h2>${arr.map(card).join('')}</section>`:'';$('products').innerHTML=section('🍔 غذاها',foods)+section('🪙 سکه',coins)+section('⛽ بنزین',fuel)+section('💎 آیتم‌های خاص',rare)||'<div class="card">محصولی وجود ندارد.</div>'}catch(e){$('products').innerHTML='<div class="card"><b>خطای اتصال به دیتابیس</b><div class="small">'+esc(friendly(e))+'</div><button class="btn" style="margin-top:10px" onclick="loadProducts()">🔄 تلاش دوباره</button></div>'}}

async function cancelOrder(id){
  if(!confirm('این سفارش لغو شود؟'))return;
  const orderId=Number(id);
  try{
    const r=await call('rp_cancel_order',{p_token:token(),p_order_id:orderId});
    if(!r || r.success!==true)throw new Error('لغو سفارش انجام نشد');
    alert('❌ سفارش لغو شد.');
    // از دیتابیس دوباره بخوان؛ اگر لحظه‌ای تأخیر بود، چند بار تلاش کن.
    for(let i=0;i<3;i++){
      await new Promise(resolve=>setTimeout(resolve,250));
      try{
        const fresh=await call('rp_my_orders',{p_token:token()});
        const found=(fresh||[]).find(o=>Number(o.id)===orderId);
        if(found && found.status==='cancelled'){
          await renderOrders();
          return;
        }
      }catch{}
    }
    // نمایش فوری در بخش لغوشده‌ها؛ وضعیت در دیتابیس قبلاً ثبت شده است.
    await renderOrders();
  }catch(e){alert(friendly(e))}
}

      p_password:newPw||null
    });
    const fresh=await call('rp_buyer_me',{p_token:token()});
    if(fresh)me=fresh;
    alert('اطلاعات کاربر با موفقیت تغییر کرد ✅\nرمز فعلی: '+(d.password_plain||'نامشخص'));
    await renderAccount();
  }catch(e){alert(friendly(e))}
}
async function refreshOwnerPanel(){try{const fresh=await call('rp_buyer_me',{p_token:token()});if(fresh)me=fresh;await loadOwnerDashboard();await renderAccount();await renderOrders();alert('پنل مالک تازه شد ✅')}catch(e){alert(friendly(e))}}
async function deleteOwnerOrder(id){if(!confirm('این سفارش برای همیشه از دیتابیس حذف شود؟'))return;try{await call('rp_delete_order',{p_token:token(),p_order_id:id});const fresh=await call('rp_buyer_me',{p_token:token()});if(fresh)me=fresh;await renderAccount();await renderOrders();alert('سفارش کامل از دیتابیس حذف شد ✅')}catch(e){alert(friendly(e))}}
async function setOrderStatus(id,status){try{const ok=await call('rp_owner_set_order_status',{p_token:token(),p_order_id:id,p_status:status});if(!ok && ok!==true)throw new Error('تغییر وضعیت سفارش انجام نشد');const fresh=await call('rp_buyer_me',{p_token:token()});if(fresh)me=fresh;alert(status==='paid'?'✅ تمام — سفارش به انجام شده منتقل شد.':'❌ سفارش به انجام نشده منتقل شد.');await renderAccount();await renderOrders()}catch(e){alert(friendly(e))}}
let chatSelectedUser=null;
async function renderChat(){
  const box=$('chat');
  if(!box)return;
  if(!me){box.innerHTML='<div class="card"><h2>💬 چت با ادمین‌ها</h2><p class="muted">برای استفاده از چت وارد حساب شو.</p><button class="btn" onclick="openLogin()">ورود</button></div>';return}
  if(me.role==='admin') return renderAdminChat(box);
  chatSelectedUser=Number(me.id);
  await renderUserChat(box);
}
async function renderUserChat(box){
  try{
    stopChatPolling();
    const data=await call('rp_chat_messages',{p_token:token(),p_user_id:Number(me.id)});
    await call('rp_chat_mark_read',{p_token:token(),p_user_id:Number(me.id)}).catch(()=>{});
    box.innerHTML='<div class="card"><h2>💬 چت با ادمین‌ها</h2><p class="muted">این گفت‌وگو خصوصی است و تمام ادمین‌ها می‌توانند پیام‌های این گفتگو را ببینند و پاسخ دهند.</p><div id="chatMessages" class="chatMessages">'+chatMessagesHtml(data||[])+'</div><div class="chatComposer"><textarea id="chatInput" maxlength="2000" placeholder="پیامت را برای ادمین‌ها بنویس..."></textarea><button class="btn" onclick="sendChatMessage()">ارسال 💬</button></div></div>';
    const el=$('chatMessages');if(el)el.scrollTop=el.scrollHeight;
    startChatPolling(Number(me.id));
  }catch(e){box.innerHTML='<div class="card"><h2>💬 چت با ادمین‌ها</h2><div class="small">'+esc(friendly(e))+'</div><button class="btn" style="margin-top:10px" onclick="renderChat()">🔄 تلاش دوباره</button></div>'}
}
function chatMessagesHtml(data){return (data||[]).map(m=>`<div class="chatBubble ${m.sender_role==='admin'?'admin':'user'}"><div>${esc(m.message)}</div><div class="chatMeta">${m.sender_role==='admin'?'🛡️ '+esc(m.sender_display_name||'ادمین'):'👤 شما'} • ${new Date(m.created_at).toLocaleString('fa-IR')}</div></div>`).join('')||'<div class="muted" style="text-align:center;padding:25px">هنوز پیامی ارسال نشده است.</div>'}
let chatPollTimer=null;
let chatLastSignature='';
async function refreshOpenChat(userId){
  if(!$('chatMessages')||!me)return;
  try{
    const data=await call('rp_chat_messages',{p_token:token(),p_user_id:Number(userId==null?me.id:userId)})||[];
    const sig=data.map(x=>`${x.id}:${x.message}`).join('|');
    if(sig!==chatLastSignature){
      const box=$('chatMessages');
      const input=$('chatInput');
      const value=input?input.value:'';
      box.innerHTML=chatMessagesHtml(data);
      box.scrollTop=box.scrollHeight;
      if(input&&document.activeElement!==input)input.value=value;
      chatLastSignature=sig;
    }
    await call('rp_chat_mark_read',{p_token:token(),p_user_id:Number(userId==null?me.id:userId)}).catch(()=>{});
  }catch(e){}
}
function stopChatPolling(){if(chatPollTimer){clearInterval(chatPollTimer);chatPollTimer=null}}
function startChatPolling(userId){stopChatPolling();chatLastSignature='';chatPollTimer=setInterval(()=>{if($('chat')&&!$('chat').classList.contains('hide'))refreshOpenChat(userId)},1500)}
async function sendChatMessage(userId=null){
  const input=$('chatInput');const text=String(input?.value||'').trim();
  if(!text)return;
  try{await call('rp_chat_send',{p_token:token(),p_user_id:userId==null?Number(me.id):Number(userId),p_message:text});if(input)input.value='';await refreshOpenChat(userId==null?Number(me.id):Number(userId));}catch(e){alert(friendly(e))}
}
async function renderAdminChat(box){
  try{
    const users=await call('rp_chat_users',{p_token:token()});
    const list=Array.isArray(users)?users:[];
    if(chatSelectedUser==null && list.length)chatSelectedUser=Number(list[0].id);
    const selected=list.find(u=>Number(u.id)===Number(chatSelectedUser));
    let messages=[];
    if(selected){messages=await call('rp_chat_messages',{p_token:token(),p_user_id:Number(selected.id)})||[];await call('rp_chat_mark_read',{p_token:token(),p_user_id:Number(selected.id)}).catch(()=>{});}
    box.innerHTML=`<div class="card"><h2>💬 چت کاربران</h2><p class="muted">همه ادمین‌ها به تمام گفتگوهای کاربران دسترسی دارند.</p><div class="chatList">${list.map(u=>`<div class="chatItem ${Number(u.id)===Number(chatSelectedUser)?'active':''}" onclick="selectChatUser(${u.id})"><b>👤 ${esc(u.username)}</b>${u.role==='admin'?`<div class="chatName">نام چت: ${esc(u.chat_display_name||'ادمین')}</div>`:''}<div class="small">${u.last_message?esc(String(u.last_message).slice(0,90)):'هنوز پیامی ندارد'}${u.last_at?' • '+new Date(u.last_at).toLocaleString('fa-IR'):''}</div></div>`).join('')||'<div class="muted">کاربری وجود ندارد.</div>'}</div></div>`+
      (selected?`<div class="card"><h3>گفتگو با ${esc(selected.username)}</h3><div class="chatName">نام نمایشی شما در این چت: ${esc(me.chat_display_name||'ادمین')}</div><div id="chatMessages" class="chatMessages">${chatMessagesHtml(messages)}</div><div class="chatComposer"><textarea id="chatInput" maxlength="2000" placeholder="پاسخ به ${esc(selected.username)}..."></textarea><button class="btn" onclick="sendChatMessage(${selected.id})">ارسال 💬</button></div></div>`:'<div class="card"><p class="muted">یک کاربر را انتخاب کن.</p></div>');
    const el=$('chatMessages');if(el)el.scrollTop=el.scrollHeight;
    if(selected)startChatPolling(Number(selected.id));
  }catch(e){box.innerHTML='<div class="card"><h2>💬 چت کاربران</h2><div class="small">'+esc(friendly(e))+'</div><button class="btn" style="margin-top:10px" onclick="renderChat()">🔄 تلاش دوباره</button></div>'}
}
function openUserChat(id){chatSelectedUser=Number(id);show('chat')}
function selectChatUser(id){chatSelectedUser=Number(id);renderChat()}
async function loadMyChatDisplayName(){if(me?.role!=='admin')return;try{const d=await call('rp_admin_display_name_get',{p_token:token(),p_user_id:Number(me.id)});me.chat_display_name=d?.chat_display_name||'ادمین';const el=$('myChatDisplayName');if(el)el.textContent=me.chat_display_name}catch(e){const el=$('myChatDisplayName');if(el)el.textContent='ادمین'}}
async function changeChatDisplayName(){if(me?.role!=='admin')return;await loadMyChatDisplayName();const v=prompt('نامی که کاربران در چت می‌بینند:',me.chat_display_name||'ادمین');if(v===null)return;const name=v.trim();if(name.length<2||name.length>40)return alert('نام نمایشی باید بین ۲ تا ۴۰ کاراکتر باشد.');try{const d=await call('rp_admin_display_name_set',{p_token:token(),p_user_id:Number(me.id),p_display_name:name});me.chat_display_name=d?.chat_display_name||name;await renderAccount();alert('نام نمایشی چت ذخیره شد ✅')}catch(e){alert(friendly(e))}}
async function ownerEditChatDisplayName(id){const u=(window.ownerUsers||[]).find(x=>Number(x.id)===Number(id));if(!u||u.role!=='admin')return;const v=prompt('نام نمایشی چت برای این ادمین:',u.chat_display_name||'ادمین');if(v===null)return;const name=v.trim();if(name.length<2||name.length>40)return alert('نام نمایشی باید بین ۲ تا ۴۰ کاراکتر باشد.');try{await call('rp_admin_display_name_set',{p_token:token(),p_user_id:Number(id),p_display_name:name});await refreshOwnerPanel()}catch(e){alert(friendly(e))}}
let gateAuthMode='login';function gateMode(m){gateAuthMode=m;$('gateLoginTab').classList.toggle('active',m==='login');$('gateRegTab').classList.toggle('active',m==='register');$('gatePw2').classList.toggle('siteHidden',m!=='register');$('gateAuthBtn').textContent=m==='register'?'ساخت حساب':'ورود';$('gateMsg').textContent='';$('gateUid').focus()}async function gateSubmit(){const id=$('gateUid').value.trim(),pw=$('gatePw').value;if(id.length<3||pw.length<5)return $('gateMsg').textContent='آیدی حداقل ۳ و رمز حداقل ۵ کاراکتر باشد.';try{if(gateAuthMode==='register'){if(pw!==$('gatePw2').value)return $('gateMsg').textContent='تکرار رمز درست نیست.';const d=await call('rp_register',{p_username:id,p_password:pw});setToken(d.token);me=await call('rp_buyer_me',{p_token:token()})||d.user}else{const d=await call('rp_login',{p_username:id,p_password:pw});setToken(d.token);me=await call('rp_buyer_me',{p_token:token()})||d.user}$('firstAuth').style.display='none';document.body.classList.remove('locked');document.querySelector('.top')?.classList.remove('siteHidden');document.querySelector('main')?.classList.remove('siteHidden');document.querySelector('.nav')?.classList.remove('siteHidden');show('home');await renderAccount()}catch(e){$('gateMsg').textContent=friendly(e)}}function finishSplash(){const sp=$('splashScreen');sp.classList.add('hideSplash');setTimeout(()=>{sp.remove();$('firstAuth').style.display='flex'},450)}
async function init(){document.querySelector('.top')?.classList.add('siteHidden');document.querySelector('main')?.classList.add('siteHidden');document.querySelector('.nav')?.classList.add('siteHidden');if(await connect()){await loadProducts()}else{$('products').innerHTML='<div class="card"><h3>⚠️ اتصال برقرار نشد</h3><p class="muted">اتصال دیتابیس را بررسی کن.</p></div>'}setTimeout(finishSplash,1300)}init();
</script></body></html>
